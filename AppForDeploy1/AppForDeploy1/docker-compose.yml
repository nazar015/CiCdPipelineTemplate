services:
  db:
    image: "postgres:16-alpine"
    container_name: postgres
    ports:
      - "54320:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=myqwerty
      - POSTGRES_DB=appForDeploy1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3
  cache:
    image: "redis:7-alpine"
    container_name: redis
    ports:
      - "63790:6379"
    expose:
      - 63790
    healthcheck:
      test: [ "CMD", "redis-cli", "PING" ]
      interval: 10s
      timeout: 5s
      retries: 3
  app:
    image: appfordeploy1:1.0
    container_name: my-app2
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__PostgreSQL: "Host=db;Port=5432;Database=appForDeploy1;Username=postgres;Password=myqwerty"
      ConnectionStrings__Redis: "cache:6379"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy